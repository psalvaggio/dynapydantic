[project]
name = "dynapydantic"
version = "0.7.0a1"
description = "Runtime tracking and polymorphic validation for pydantic models"
readme = "README.md"
authors = [
    { name = "Philip Salvaggio", email = "salvaggio.philip@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.8,<3",
]

[dependency-groups]
dev = [
    "click>=8.2.1",
    "coveralls>=4.0.1",
    "griffe<2.0.0a0",
    "griffe-pydantic>=1.1.4",
    "mike>=2.1.3",
    "mkdocs-material>=9.6.15",
    "mkdocstrings[python]>=0.29.1",
    "nox>=2025.10.16",
    "pip>=25.1.1",
    "prek>=0.3.8",
    "pymdown-extensions>=10.16",
    "pyperf>=2.9.0",
    "pyrefly>=0.44.1",
    "pytest>=8.4.1",
    "pytest-benchmark>=5.1.0",
    "pytest-codspeed>=3.0.0",
    "pytest-cov>=6.2.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=dynapydantic --cov-report=html --cov-branch"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # trailing commas, handled by formatter
    "CPY001", # not doing copyrights in each file
    "D400", # docstrings end in .
    "ANN002", # Annotations for *args
    "ANN003", # Annotations for *kwargs
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "S101", # asserts allowed in tests
    "ARG", # Unused function args -> (fixtures can be unused)
    "FBT", # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    "PLR2004", # Magic value used in comparison
]
"benchmarks/**/*.py" = [
    "ANN", # pytest fixtures and benchmark callables are dynamically typed
    "ARG", # parametrized benchmark fixtures are intentionally unused
    "INP001", # benchmark conftest is loaded by pytest
    "PLR2004", # benchmark sizes are intentionally explicit
    "SLF001", # benchmark internal registry reset is deliberate
    "PLC0415", # dynamic benchmark setup keeps imports local where useful
    "E501", # benchmark callables are easier to compare when kept on one line
    "EM101", # expected-failure guard has no useful exception detail
    "TRY003", # expected-failure guard has no useful exception detail
]
"**/cli.py" = [
    "PLC0415", # imports in CLI functions improve load times
]

[tool.ruff.per-file-target-version]
"tests/test_generics_py312.py" = "py312"

[tool.pyrefly]
# We have a few embedded packages in our tests to test out plugins
search-path = [
    ".",
    "tests/example/animal-plugins",
    "tests/example/base-package",
    "tests/example/shape-plugins",
]
project-includes = ["src", "tests", "benchmarks"]
